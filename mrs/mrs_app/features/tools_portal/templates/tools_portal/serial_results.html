{% extends "base.html" %}{% block content %}<link rel="stylesheet" href="{{ url_for('tools_portal.static',filename='tools.css') }}"><section class="card tool-page"><a href="{{ url_for('tools_portal.serial') }}">&larr; New Search</a><h1>Search Results</h1><p>{{ found|length }} matching files from {{ file_count }} scanned.</p>{% for r in found %}<div class="result"><b>{{ r.file }}</b><br>Matched: {{ r.hits|join(', ') }}</div>{% else %}<p>No matching serial numbers were found.</p>{% endfor %}</section>{% endblock %}
