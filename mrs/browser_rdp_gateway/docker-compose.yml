services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: osv-guacd
    restart: unless-stopped
    networks: [guacnet]
  postgres:
    image: postgres:16-alpine
    container_name: osv-guac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD}
    volumes:
      - guac_db:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks: [guacnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 10s
      timeout: 5s
      retries: 10
  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: osv-guacamole
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD}
      WEBAPP_CONTEXT: guacamole
    ports:
      - "127.0.0.1:8080:8080"
    networks: [guacnet]
networks:
  guacnet:
    driver: bridge
volumes:
  guac_db:
